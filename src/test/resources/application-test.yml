# Aktiveras med profilen test (@ActiveProfiles("test")). Kompletterar application.yml i stället för att skugga den.
spring:
  datasource:
    url: jdbc:h2:mem:minaarenden;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

minaarenden:
  producent: Testköpings kommun
  prefix: TESTKOP
  standard-version: "6.1"
  client-id: ""
  client-secret: ""
  admin-api-key: ""
  seed: true
