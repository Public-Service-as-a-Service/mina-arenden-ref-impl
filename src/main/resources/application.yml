spring:
  application:
    name: mina-arenden-ref-impl
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/minaarenden}
    username: ${DB_USER:minaarenden}
    password: ${DB_PASSWORD:minaarenden}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  # skv_client_correlation_id (MDC-nyckeln correlationId) på varje loggrad som hör till ett anrop.
  pattern:
    level: "%5p [%X{correlationId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

minaarenden:
  # Producentens namn i svaren (delfragor.producent och kundhandelse.producent).
  producent: ${MINA_ARENDEN_PRODUCENT:Referenskommunen}
  # Producentprefix, första delen i kundhändelsetyper (versaler, inga å/ä/ö).
  prefix: ${MINA_ARENDEN_PREFIX:REFKOM}
  # Version av Mina ärendens standard som producenten implementerar.
  standard-version: ${MINA_ARENDEN_STANDARD_VERSION:6.1}
  # Om satta krävs matchande headrar client_id och client_secret på /kundhandelseFragaSynkron.
  # Måste sättas i par: bara den ena stoppar starten (fail-closed).
  client-id: ${CLIENT_ID:}
  client-secret: ${CLIENT_SECRET:}
  # Om satt krävs headern X-Api-Key på /kundhandelser (inläsning till cachen).
  admin-api-key: ${ADMIN_API_KEY:}
  # true: applikationen vägrar starta om någon av nycklarna ovan saknas. Sätts av profilen production.
  krav-autentisering: ${MINA_ARENDEN_KRAV_AUTENTISERING:false}
  # Läs in exempelhändelser vid start om cachen är tom (endast utveckling/demo).
  seed: ${MINA_ARENDEN_SEED:false}

---
# Profilen production (SPRING_PROFILES_ACTIVE=production): autentisering obligatorisk, ingen exempeldata.
spring:
  config:
    activate:
      on-profile: production

minaarenden:
  krav-autentisering: true
  seed: false
