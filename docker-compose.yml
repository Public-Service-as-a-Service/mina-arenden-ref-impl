# Tjänsten med intern MariaDB, för Dokploy (Compose-tjänst) och lokalt.
#
# Datat ligger i volymen mariadb-data och överlever omdeploy, omstart och ny version. Vid varje deploy körs först
# db-prepare, som tar en säkerhetskopia (volymen mariadb-backups) och synkar databaslösenordet, innan app startar
# och Flyway migrerar schemat framåt. Databasen publiceras inte utanför Compose-nätverket.
#
# Ta aldrig bort volymerna (docker compose down -v, eller "Delete volumes" i Dokploy) om datat ska finnas kvar.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/minaarenden
      DB_USER: minaarenden
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD måste sättas}
      API_KEYS_FRAGA: ${API_KEYS_FRAGA:-}
      # Utan giltig nyckel vägrar tjänsten starta (se README). ADMIN_API_KEY läses för att äldre deployer ska fungera.
      API_KEYS_ADMIN: ${API_KEYS_ADMIN:-${ADMIN_API_KEY:-}}
      MINA_ARENDEN_MUNICIPALITY_ID: ${MINA_ARENDEN_MUNICIPALITY_ID:-2281}
      MINA_ARENDEN_PRODUCENT: ${MINA_ARENDEN_PRODUCENT:-Referenskommunen}
      MINA_ARENDEN_PREFIX: ${MINA_ARENDEN_PREFIX:-REFKOM}
      MINA_ARENDEN_STANDARD_VERSION: ${MINA_ARENDEN_STANDARD_VERSION:-6.1}
      MINA_ARENDEN_SEED: ${MINA_ARENDEN_SEED:-false}
      TZ: Europe/Stockholm
    depends_on:
      db:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
    # Pågående anrop hinner avslutas (graceful shutdown) innan containern ersätts.
    stop_grace_period: 30s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: minaarenden
      MARIADB_USER: minaarenden
      # Läses bara när volymen initieras (första deploy). Byte av DB_PASSWORD därefter hanteras av db-prepare.
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD måste sättas}
      # Som i tidigare versioner: utan DB_ROOT_PASSWORD blir root-lösenordet samma som DB_PASSWORD.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: UTC
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # InnoDB får stänga ner i lugn och ro vid omdeploy.
    stop_grace_period: 60s

  db-prepare:
    build:
      context: docker/db-prepare
    restart: "no"
    environment:
      DB_HOST: db
      DB_NAME: minaarenden
      DB_USER: minaarenden
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD måste sättas}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      DB_BACKUP_KEEP: ${DB_BACKUP_KEEP:-10}
    volumes:
      - mariadb-backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb-data:
  mariadb-backups:
