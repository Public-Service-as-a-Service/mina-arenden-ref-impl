name: "Docker och omdeploy"

# Bygger containern med docker/Dockerfile via docker-compose.yml (som Dokploy gör) och verifierar att en omdeploy
# med ny build och bytt databaslösenord behåller datat. Se docker/redeploy-test.sh.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  redeploy:
    name: Bygg och verifiera omdeploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Kör omdeploy-test
        run: ./docker/redeploy-test.sh
