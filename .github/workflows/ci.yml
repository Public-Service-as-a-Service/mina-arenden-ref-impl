name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Bygg och testa (H2 + MariaDB via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg och kör tester
        run: ./gradlew --no-daemon build
      - name: Spara testrapporter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrapporter
          path: build/reports/tests/test
          if-no-files-found: ignore

  docker:
    name: Bygg containerbild
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg bilden (publiceras inte)
        run: docker build --tag mina-arenden-ref-impl:ci .
